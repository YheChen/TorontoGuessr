name: Browser checks

# Real-browser checks against a DEPLOYED site. Separate from ci.yml on purpose:
# ci.yml must stay fast and hermetic, while this needs a deployment to exist and
# talks to Google Maps over the network.
#
# WHY IT RUNS AFTER DEPLOY RATHER THAN ON THE PR. Two reasons, both hard:
#   * The Google Maps key is referrer-restricted, so a localhost build renders the
#     map containers and then Maps refuses; no pin can be placed and most of the
#     suite is untestable. The e2e config documents this.
#   * Vercel preview deployments sit behind SSO, so a preview URL answers 302 to
#     vercel.com/sso-api. Reaching one needs the project's automation bypass
#     secret, which is not configured, so previews are not run AT ALL rather than
#     run-and-skipped. A skipped job still reports a green check, and a green
#     "Browser checks" on a PR that tested nothing is worse than no check: that
#     exact green appeared on PR 60 with every test step skipped. To check previews
#     before merge, add VERCEL_AUTOMATION_BYPASS_SECRET and widen the `if` below to
#     include preview environments.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment to test (defaults to production)"
        required: false
        type: string

permissions:
  contents: read

# Never cancel an in-flight run: each one starts a real game, and killing it
# midway leaves a session in a stranger state than letting it finish.
# Keyed on the ENVIRONMENT as well as the ref. Both Vercel projects report a
# deployment_status for the same commit, so a ref-only group put the frontend and
# backend events in one queue, where one was cancelled and the frontend's
# production run never happened.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event.deployment.environment || 'dispatch' }}
  cancel-in-progress: false

jobs:
  browser:
    name: Browser checks
    # Only successful FRONTEND deployments. Both Vercel projects report here, and
    # the backend has no pages to look at.
    #
    # NO `secrets` REFERENCE HERE. The first version of this condition also
    # checked secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '', which is not allowed:
    # the secrets context does not exist in a job-level if, and using it makes the
    # whole workflow FILE invalid. GitHub does not report that as a failing check,
    # it reports a run with zero jobs, so the workflow simply never ran and nothing
    # said why. The preview-versus-production decision moved into the Resolve step
    # below, where secrets are available.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production') &&
       !contains(github.event.deployment.environment, 'backend'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve the target
        id: target
        env:
          DISPATCH_URL: ${{ inputs.base_url }}
        run: |
          # The CANONICAL domain, not github.event.deployment_status.environment_url.
          #
          # Vercel reports environment_url as the deployment-specific host even for
          # a production deployment, and that host is behind Vercel's SSO: measured
          # 302 for https://toronto-guessr-<hash>-yhechens-projects.vercel.app while
          # https://www.torontoguessr.ca answered 200 for the same deployment. Using
          # it meant the whole suite ran against a login page, which failed as every
          # element being invisible and looked like a catastrophic layout break.
          #
          # A production deployment_status is only ever about the live site, so the
          # live domain is the right target and needs no secret.
          url="${DISPATCH_URL:-https://www.torontoguessr.ca}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Testing $url"

      # Only chromium. A second engine would double the runtime to re-check
      # geometry that is not engine specific.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run browser checks
        run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # Traces and screenshots are the whole value of a failed layout run: the
      # numbers are in the report and the screenshot shows what it looked like.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
