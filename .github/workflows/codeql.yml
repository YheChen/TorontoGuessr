name: CodeQL

# Static security analysis for the JS/TS in both workspaces. Runs on pushes to
# main, on every PR, and weekly so newly disclosed query patterns catch old code.
#
# `pull_request` carries no branch filter on purpose. It used to be limited to
# PRs targeting main, which had two costs. Stacked PRs got no security scanning at
# all, since their base is another feature branch. Worse, once "Analyze JS/TS" is
# a required check, a PR retargeted onto main after its base merged would never
# run it: a base change fires pull_request.edited, which is not one of the events
# that starts a workflow, so the required check would simply be absent and the PR
# would be unmergeable with nothing to click.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JS/TS
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: javascript-typescript
          # No compilation needed for JS/TS; skip the build phase entirely.
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:javascript-typescript"
